# Postgres instead of SQLite (tickets, audit trail and LangGraph checkpoints):
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up
services:
  app:
    environment:
      DATABASE_URL: postgresql+psycopg://support:support@postgres:5432/support
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: support
      POSTGRES_PASSWORD: support
      POSTGRES_DB: support
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg-data:
