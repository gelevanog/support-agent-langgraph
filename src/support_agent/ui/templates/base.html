<!doctype html>
<html lang="en">
<head>

  <title>{% block title %}Support Autopilot{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('ui-static', path='style.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js" defer></script>
</head>
<body>

</html>
