[project]
name = "support-agent"
version = "0.1.0"
description = "Support Autopilot: a LangGraph agent that resolves e-commerce support tickets with deterministic business rules and human approval."
readme = "README.md"
license = "MIT"
authors = [{ name = "Ivan Savchenko" }]
requires-python = ">=3.11"
dependencies = [
    "aiosqlite",
    "fastapi",
    "httpx",
    "jinja2",
    "langchain-anthropic",
    "langchain-core",
    "langchain-openai",
    "langgraph",
    "langgraph-checkpoint-sqlite",
    "pydantic",
    "pydantic-settings",
    "python-multipart",
    "rich",
    "sqlalchemy[asyncio]",
    "structlog",
    "typer",
    "uvicorn[standard]",
]

[project.optional-dependencies]
postgres = ["langgraph-checkpoint-postgres", "psycopg[binary,pool]"]

[dependency-groups]
dev = ["mypy", "pytest", "pytest-asyncio", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
support-agent = "support_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/support_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PTH", "N", "C4", "PIE", "RET", "TC"]
ignore = ["TC001", "TC002", "TC003", "RUF001", "SIM905"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.Form", "typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["support_agent"]
